name: Benchmark harness build

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out benchmark repository
        uses: actions/checkout@v4
      - name: Check out GUI source development branch
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.GUI
          ref: development
          path: TheSingularityWorkshop.GUI
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build WPF benchmark harness
        run: dotnet build src/WpfBench/TheSingularityWorkshop.Benchmarks.GUI.WpfBench.csproj --configuration Release
      - name: Build Blazor render-tree benchmark harness
        run: dotnet build src/BlazorBench/TheSingularityWorkshop.Benchmarks.GUI.BlazorBench.csproj --configuration Release
      - name: Smoke-run WPF benchmarks (Dry job)
        run: dotnet run --project src/WpfBench/TheSingularityWorkshop.Benchmarks.GUI.WpfBench.csproj --configuration Release --no-build -- --filter "*WpfAdapterBenchmarks*" --job Dry
      - name: Build browser-hosted Blazor comparison
        run: dotnet build src/BlazorBrowserBench/TheSingularityWorkshop.Benchmarks.GUI.BlazorBrowserBench.csproj --configuration Release
      - name: Install Playwright Chromium
        run: pwsh src/BlazorBrowserBench/bin/Release/net8.0/playwright.ps1 install chromium
      - name: Smoke-run browser-hosted Blazor comparison
        run: dotnet run --project src/BlazorBrowserBench/TheSingularityWorkshop.Benchmarks.GUI.BlazorBrowserBench.csproj --configuration Release --no-build
      - name: Smoke-run Blazor benchmarks (Dry job)
        run: dotnet run --project src/BlazorBench/TheSingularityWorkshop.Benchmarks.GUI.BlazorBench.csproj --configuration Release --no-build -- --filter "*BlazorRenderTreeBenchmarks*" --job Dry
      - name: Upload smoke-run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-benchmark-smoke-${{ github.run_id }}
          path: BenchmarkDotNet.Artifacts/**
          if-no-files-found: warn
          retention-days: 14
