name: Measure GUI adapter baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out benchmark repository
        uses: actions/checkout@v4
      - name: Check out GUI source development branch
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.GUI
          ref: development
          path: TheSingularityWorkshop.GUI
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Capture environment manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path results/environment | Out-Null
          dotnet --info | Out-File results/environment/dotnet-info.txt -Encoding utf8
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, CsSystemType, CsProcessorName, CsNumberOfLogicalProcessors, CsTotalPhysicalMemory | Format-List | Out-File results/environment/host.txt -Encoding utf8
          Get-Date -Format o | Out-File results/environment/captured-at.txt -Encoding utf8
      - name: Build WPF benchmark harness
        run: dotnet build src/WpfBench/TheSingularityWorkshop.Benchmarks.GUI.WpfBench.csproj --configuration Release
      - name: Measure WPF host lifecycle and layout
        run: dotnet run --project src/WpfBench/TheSingularityWorkshop.Benchmarks.GUI.WpfBench.csproj --configuration Release --no-build -- --lifecycle
      - name: Build Blazor render-tree benchmark harness
        run: dotnet build src/BlazorBench/TheSingularityWorkshop.Benchmarks.GUI.BlazorBench.csproj --configuration Release
      - name: Build browser-hosted Blazor comparison
        run: dotnet build src/BlazorBrowserBench/TheSingularityWorkshop.Benchmarks.GUI.BlazorBrowserBench.csproj --configuration Release
      - name: Install Playwright Chromium
        run: pwsh src/BlazorBrowserBench/bin/Release/net8.0/playwright.ps1 install chromium
      - name: Capture browser comparison
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/results/browser" | Out-Null
          dotnet run --project src/BlazorBrowserBench/TheSingularityWorkshop.Benchmarks.GUI.BlazorBrowserBench.csproj --configuration Release --no-build
          $csvPath = Join-Path $env:GITHUB_WORKSPACE "results/browser/blazor-browser.csv"
          if (-not (Test-Path -LiteralPath $csvPath -PathType Leaf)) {
            throw "Browser comparison CSV was not created at expected artifact path: $csvPath"
          }
          $rows = @(Import-Csv -LiteralPath $csvPath)
          if ($rows.Count -ne 60) {
            throw "Expected 60 browser comparison rows (30 native + 30 GUI), found $($rows.Count)."
          }
          $nativeRows = @($rows | Where-Object { $_.kind -eq "native" }).Count
          $guiRows = @($rows | Where-Object { $_.kind -eq "gui" }).Count
          if ($nativeRows -ne 30 -or $guiRows -ne 30) {
            throw "Expected 30 native and 30 GUI rows; found native=$nativeRows gui=$guiRows."
          }
          Get-Item -LiteralPath $csvPath | Select-Object FullName, Length | Format-List
      - name: Measure Blazor render-tree construction
        run: dotnet run --project src/BlazorBench/TheSingularityWorkshop.Benchmarks.GUI.BlazorBench.csproj --configuration Release --no-build -- --filter "*BlazorRenderTreeBenchmarks*"
      - name: Upload measured results and environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-adapter-measurements-${{ github.run_id }}
          path: |
            BenchmarkDotNet.Artifacts/**
            results/environment/**
            results/browser/**
            results/wpf/**
          if-no-files-found: warn
          retention-days: 90
